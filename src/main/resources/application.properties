# Language: Java Properties Format (Key-Value Configuration)
# Purpose: Defines runtime configuration for Spring Boot, PostgreSQL datasource connection pool, Hibernate JPA parameters, and Flyway database migrations.
# ==============================================================================
# SERENDIP Application Configuration (Spring Boot & Supabase PostgreSQL)
# ==============================================================================

spring.application.name=serendip-marketplace
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# Datasource Configuration (Supabase PostgreSQL via Transaction Pooler)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.kqurdsddnazfkjanjhhn}
spring.datasource.password=Serendip@1234$
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Settings (Optimized for Supabase)
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ------------------------------------------------------------------------------
# Flyway Database Migration Configuration
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
