# Language: Java Properties Format (Key-Value Configuration)
# Purpose: Configures the isolated in-memory H2 database test environment with PostgreSQL compatibility mode for unit and integration testing.
# ==============================================================================
# SERENDIP Test Configuration (H2 In-Memory Database with PostgreSQL Dialect Emulation)
# ==============================================================================

spring.application.name=serendip-marketplace-test

# Fast, self-contained in-memory database independent of external PostgreSQL servers
spring.datasource.url=jdbc:h2:mem:serendiptest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway execution on test datasource
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Hibernate validates schema produced by Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
